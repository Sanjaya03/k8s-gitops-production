{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres-headless
  replicas: {{ .Values.database.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999

      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository}}:{{ .Values.database.image.tag }}"
          ports:
            - containerPort: {{ .Values.database.port }}

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prod-enterprise-platform-db-secret
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.database.dbName | quote }}
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          resources:
            requests:
              cpu: {{ .Values.database.resources.requests.cpu }}
              memory: {{ .Values.database.resources.requests.memory }}
            limits:
              cpu: {{ .Values.database.resources.limits.cpu }}
              memory: {{ .Values.database.resources.limits.memory }}
        
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - {{ .Values.database.dbName | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - {{ .Values.database.dbName | quote }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5

          volumeMounts:
            - name: tmp-buff
              mountPath: /tmp
            - name: socket-buff
              mountPath: /var/run/postgresql
            - name: db-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: tmp-buff
          emptyDir: {}
        - name: socket-buff
          emptyDir: {}  

  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.database.storage }}
{{- end }} 